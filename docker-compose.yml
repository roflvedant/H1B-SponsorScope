services:
  postgres:
    image: postgres:16
    container_name: h1b-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: h1b_jobs
      POSTGRES_USER: h1b_user
      POSTGRES_PASSWORD: h1b_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U h1b_user -d h1b_jobs"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: